version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: casahoy-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: casahoy
    ports:
      - "5432:5432"
    volumes:
      - casahoy-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d casahoy"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: casahoy-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: casahoy
      DB_USER: app
      DB_PASSWORD: app
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: casahoy-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  casahoy-data: